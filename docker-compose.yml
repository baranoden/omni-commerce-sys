services:
  auth-db:
    image: postgres:17-alpine
    container_name: omni-commerce-auth-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - '5433:5432'
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d auth_db']
      interval: 10s
      timeout: 5s
      retries: 10

  products-db:
    image: postgres:17-alpine
    container_name: omni-commerce-products-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: products_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - '5434:5432'
    volumes:
      - products_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d products_db']
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:latest
    container_name: omni-commerce-kafka
    restart: unless-stopped
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: omni-commerce-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - '8080:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: auth-service
    container_name: omni-commerce-auth-service
    restart: unless-stopped
    depends_on:
      auth-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      NODE_ENV: production
      AUTH_SERVICE_HOST: 0.0.0.0
      AUTH_SERVICE_TCP_PORT: 4002
      AUTH_DB_HOST: auth-db
      AUTH_DB_PORT: 5432
      AUTH_DB_USERNAME: postgres
      AUTH_DB_PASSWORD: 123456
      AUTH_DB_NAME: auth_db
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: SUPER_SECRET_KEY
      JWT_EXPIRES_IN: 7d
    ports:
      - '4002:4002'

  products-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: products-service
    container_name: omni-commerce-products-service
    restart: unless-stopped
    depends_on:
      products-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PRODUCTS_SERVICE_HOST: 0.0.0.0
      PRODUCTS_SERVICE_TCP_PORT: 4001
      PRODUCTS_DB_HOST: products-db
      PRODUCTS_DB_PORT: 5432
      PRODUCTS_DB_USERNAME: postgres
      PRODUCTS_DB_PASSWORD: 123456
      PRODUCTS_DB_NAME: products_db
      KAFKA_BROKERS: kafka:29092
    ports:
      - '4001:4001'

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: api-gateway
    container_name: omni-commerce-api-gateway
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_started
      products-service:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_TCP_PORT: 4002
      PRODUCTS_SERVICE_HOST: products-service
      PRODUCTS_SERVICE_TCP_PORT: 4001
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: SUPER_SECRET_KEY
      LOG_LEVEL: info
    ports:
      - '3000:3000'

volumes:
  auth_db_data:
  products_db_data:
  kafka_data:
